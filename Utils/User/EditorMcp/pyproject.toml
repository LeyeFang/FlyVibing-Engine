[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-editor-mcp"
version = "0.3.0"
description = "MyGameEngine Editor Live MCP — standalone stdio bridge to a running engine editor (127.0.0.1:8977)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.10",
    "Pillow>=10",
    "numpy>=1.26",
]

[project.scripts]
engine-editor-mcp = "engine_editor_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
