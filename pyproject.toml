[project]
name = "your-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cffi==2.0.0",
    "esper==3.7",
    "glfw==2.10.0",
    "multipledispatch==1.0.0",
    "numpy==2.4.4",
    "pillow>=10.0.0",
    "pycparser==3.0",
    "PyOpenGL",
    "PyOpenGL_accelerate",
    "pyrr==0.10.3",
    "pysdl2==0.9.17",
    "pysdl2-dll==2.32.0",
    "scipy>=1.12.0",
    "trimesh==4.12.1",
    "vulkan==1.3.275.1",
    "zengl>=2.7.0",
]

[project.optional-dependencies]
gui = [
    "imgui-bundle; python_version < '3.13'"
]
gui-314 = [
    "imgui-bundle @ git+https://github.com/pthom/imgui_bundle@e58ff91"
]
device = [
    "econexg[lsl,usb]",
    "gpype; python_version < '3.14'"
]
